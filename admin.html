<script id="hmr">
/* ===== HMR · progress reconcile + badge engine (identical copy lives in the student site and the admin) =====
   1. normId      - turns old lesson ids ("1", "w2d1", "Week 2 Day 1", "2_1" ...) into today's ids ("2-1")
   2. reconcile   - keeps every previously finished lesson, and (once per student) credits weeks the student already
                    finished / submitted / took the quiz for. Nothing is ever removed; unknown ids are kept in legacyCompleted.
   3. visitDays   - days visited are kept IN the student record (not only on one device) and rebuilt from past activity.
   4. badgeCalc   - the same formula the student profile uses, so the admin shows exactly the badge the student wears.   */
(function(g){
  var DEF_BADGES=[{name:'Starter',color:'#b7791f',progress:0,result:0,visits:1},{name:'Explorer',color:'#8a94a6',progress:15,result:50,visits:3},{name:'Creator',color:'#e0a800',progress:40,result:65,visits:6},{name:'Designer',color:'#12b886',progress:70,result:80,visits:10},{name:'Master',color:'#8b5cf6',progress:100,result:90,visits:15}];
  function cmpId(a,b){var A=String(a).split('-').map(Number),B=String(b).split('-').map(Number);return (A[0]-B[0])||(A[1]-B[1]);}
  function iso(d){try{var x=new Date(d);return isNaN(x)?'':x.toISOString().slice(0,10);}catch(e){return '';}}
  function ctxOf(ids){var list=Array.from(new Set((ids||[]).map(String))).sort(cmpId),set={},byWeek={};list.forEach(function(i){set[i]=1;var w=i.split('-')[0];(byWeek[w]=byWeek[w]||[]).push(i);});return {list:list,set:set,byWeek:byWeek};}
  var RX=/^(?:week|wk|w|day|d|lesson|l)?[\s_#]*0*(\d{1,2})(?:[\s_.\-:\/\u00b7\u2013\u2014]+(?:(?:day|d|lesson|l)[\s_#\-]*)?|[\s_]*(?:day|d|lesson|l)[\s_#\-]*)0*(\d{1,2})$/;
  function normId(raw,ctx){
    if(raw==null)return null;var s=String(raw).trim().toLowerCase();if(!s)return null;if(ctx.set[s])return s;
    var m=RX.exec(s);if(m){var id=(+m[1])+'-'+(+m[2]);return ctx.set[id]?id:null;}
    if(/^\d+$/.test(s)){var n=+s;return (n>=1&&n<=ctx.list.length)?ctx.list[n-1]:null;}   /* old numbering 1,2,3 ... = lesson number */
    return null;
  }
  function weekNum(k){var m=/\d+/.exec(String(k));return m?String(+m[0]):null;}
  function activityDays(rec){
    var out={},add=function(v){var d=iso(v);if(d&&d>'2020')out[d]=1;};rec=rec||{};
    Object.keys(rec.weekFinished||{}).forEach(function(k){add(rec.weekFinished[k]);});
    Object.keys(rec.weekSubmissions||{}).forEach(function(k){var x=rec.weekSubmissions[k];add(x&&(x.at||x.date));});
    Object.keys(rec.weekQuizzes||{}).forEach(function(k){var x=rec.weekQuizzes[k];if(x)add(x.at||x.date||x.takenAt||x.completedAt);});
    var pa=rec.phaseAssessments||{};Object.keys(pa).forEach(function(k){add(pa[k]&&pa[k].completedAt);});
    ['createdAt','lastSavedAt','lastLogin'].forEach(function(k){if(rec[k])add(rec[k]);});
    return Object.keys(out);
  }
  function visitDays(rec,local){var s={};(rec.visitDays||[]).forEach(function(d){s[d]=1;});(local||[]).forEach(function(d){s[d]=1;});activityDays(rec).forEach(function(d){s[d]=1;});return Object.keys(s).sort();}
  /* sync: merge local-device days + activity into rec.visitDays; returns {count,changed} */
  function syncVisits(rec,local,today){
    var all=visitDays(rec,local);if(today&&all.indexOf(today)<0)all.push(today);all.sort();all=all.slice(-400);
    var changed=JSON.stringify(all)!==JSON.stringify(rec.visitDays||[]);if(changed)rec.visitDays=all;
    return {count:all.length,changed:changed};
  }
  /* reconcile(rec, ids, {dry}) -> report. Mutates rec unless dry. */
  function reconcile(rec,ids,opt){
    opt=opt||{};var ctx=ids&&ids.set?ids:ctxOf(ids);rec=rec||{};
    var before=(rec.completed||[]).length,effBefore=(rec.completed||[]).filter(function(x){return ctx.set[String(x).trim().toLowerCase()];}).length,done={},remapped=[],unmatched=[],credited=[];
    (rec.completed||[]).concat(rec.legacyCompleted||[]).forEach(function(x){var n=normId(x,ctx);if(n){if(String(x)!==n)remapped.push([String(x),n]);done[n]=1;}else if(unmatched.indexOf(String(x))<0)unmatched.push(String(x));});
    var already=(rec.migrated||0)>=2;
    if(!already&&opt.credit!==false){
      var ev={};
      Object.keys(rec.weekFinished||{}).forEach(function(k){if(rec.weekFinished[k]){var w=weekNum(k);if(w)(ev[w]=ev[w]||[]).push('week marked finished');}});
      Object.keys(rec.weekSubmissions||{}).forEach(function(k){var w=weekNum(k);if(w)(ev[w]=ev[w]||[]).push('weekly work submitted');});
      Object.keys(rec.weekQuizzes||{}).forEach(function(k){var w=weekNum(k);if(w)(ev[w]=ev[w]||[]).push('week quiz taken');});
      Object.keys(ev).forEach(function(w){(ctx.byWeek[w]||[]).forEach(function(id){if(!done[id]){done[id]=1;credited.push({id:id,why:ev[w][0]});}});});
    }
    var after=Object.keys(done).sort(cmpId);
    var changed=remapped.length>0||credited.length>0||after.length!==before||(unmatched.length>0&&JSON.stringify(unmatched)!==JSON.stringify(rec.legacyCompleted||[]))||(!already&&opt.credit!==false);
    if(!opt.dry){
      rec.completed=after;
      if(unmatched.length)rec.legacyCompleted=unmatched;else delete rec.legacyCompleted;
      if(credited.length){rec.autoCredited=Array.from(new Set((rec.autoCredited||[]).concat(credited.map(function(c){return c.id;}))));}
      if(!already&&opt.credit!==false){rec.migrated=2;rec.migratedAt=new Date().toISOString();}
    }
    return {changed:changed,before:before,effBefore:effBefore,after:after.length,remapped:remapped,unmatched:unmatched,credited:credited,already:already,ids:after};
  }
  function gradeOf(rec,T){
    rec=rec||{};var done=(rec.completed||[]).length,wq=rec.weekQuizzes||{},qs=Object.keys(wq),sum=0;
    qs.forEach(function(k){var q=wq[k]||{};sum+=q.total?(q.score/q.total)*100:100;});
    var comp=T.lessons?(done/T.lessons)*100:0,qa=qs.length?sum/qs.length:0;
    var rd=T.reading?Math.min(100,((rec.readingSeen||[]).length/T.reading)*100):0;
    var vc=Object.keys(rec.videoConfirmed||{}).filter(function(k){return rec.videoConfirmed[k];}).length;
    var vd=T.video?Math.min(100,(vc/T.video)*100):0;
    return {overall:Math.round(comp*.45+qa*.25+rd*.15+vd*.15),pct:T.lessons?Math.min(100,Math.round(done/T.lessons*100)):0,done:done,quizzes:qs.length};
  }
  function letter(o){return o>=97?'A+':o>=93?'A':o>=90?'A-':o>=87?'B+':o>=83?'B':o>=80?'B-':o>=77?'C+':o>=73?'C':o>=70?'C-':o>=67?'D+':o>=63?'D':o>=60?'D-':'NI';}
  function badgeCalc(vals,badges){
    var B=(badges&&badges.length)?badges:DEF_BADGES,cur=-1;
    B.forEach(function(b,i){if(vals.pct>=b.progress&&vals.res>=b.result&&vals.visits>=b.visits)cur=i;});
    var idx=Math.max(cur,0),nx=B[cur+1]||null;
    var need=nx?{progress:Math.max(0,nx.progress-vals.pct),result:Math.max(0,nx.result-vals.res),visits:Math.max(0,nx.visits-vals.visits)}:null;
    /* closeness to next badge: average of the three requirement ratios */
    var near=nx?Math.round(([nx.progress?Math.min(1,vals.pct/nx.progress):1,nx.result?Math.min(1,vals.res/nx.result):1,nx.visits?Math.min(1,vals.visits/nx.visits):1].reduce(function(a,b){return a+b;},0)/3)*100):100;
    return {earned:cur>=0,idx:idx,level:idx+1,total:B.length,badge:B[idx],next:nx,need:need,near:near};
  }
  function shield(color,z,on){return '<svg width="'+z+'" height="'+z+'" viewBox="0 0 24 24" aria-hidden="true" style="display:block;flex:none"><path d="M12 2 4 5v6c0 5 3.4 9.3 8 11 4.6-1.7 8-6 8-11V5z" fill="'+(on?color:'#9aa2b1')+'"/><path d="M12 2 4 5v6c0 .9.1 1.8.3 2.6L12 11z" fill="rgba(255,255,255,.22)"/><polygon points="12 7.2 13.4 10.4 16.9 10.7 14.3 13 15.1 16.4 12 14.6 8.9 16.4 9.7 13 7.1 10.7 10.6 10.4" fill="#fff"/></svg>';}
  /* Google Drive thumbnails: try several endpoints before giving up */
  function thumbChain(id,w){id=encodeURIComponent(id);w=w||640;return ['https://drive.google.com/thumbnail?id='+id+'&sz=w'+w,'https://lh3.googleusercontent.com/d/'+id+'=w'+w,'https://drive.google.com/uc?export=view&id='+id];}
  g.HMR={DEF_BADGES:DEF_BADGES,cmpId:cmpId,iso:iso,ctxOf:ctxOf,normId:normId,activityDays:activityDays,visitDays:visitDays,syncVisits:syncVisits,reconcile:reconcile,gradeOf:gradeOf,letter:letter,badgeCalc:badgeCalc,shield:shield,thumbChain:thumbChain};
})(typeof window!=='undefined'?window:globalThis);

</script>

const mapQ=(q,j)=>({n:+q.n||j+1,q:String(q.q||''),options:(q.options||q.o||[]).map(String),answer:+(q.answer!=null?q.answer:q.a)||0,why:String(q.why!=null?q.why:(q.w||''))});
const normSec=(s,i)=>({id:String(s.id!=null?s.id:i),name:String(s.name||''),title:String(s.title||''),img:s.img||'',gallery:!!s.gallery||s.name==='Cross',questions:(s.questions||s.qs||[]).map(mapQ).filter(q=>q.q&&q.options.length>1)});
function readHTML(html,which){
  const bm=/<script id="cc-9-live">\s*window\.HM_BAKED\s*=\s*([\s\S]*?);\s*<\/script>/.exec(html);
  if(which==='live'&&bm){try{const o=JSON.parse(bm[1]);if(o.kc&&o.kc.sections&&o.kc.sections.length)return{list:o.kc.sections.map(normSec),from:'the version published on the student site'}}catch(e){}}
  const m=/<script type="application\/json" id="kc-data">([\s\S]*?)<\/script>/.exec(html);
  if(!m)throw new Error('That file has no Check Your Knowledge questions in it. Choose the student site index.html.');
  return{list:JSON.parse(m[1]).map(normSec),from:'the built-in questions of the student site'};
}
function readAny(text,which){
  const t=String(text).trim();
  if(t[0]==='['||t[0]==='{'){
    const o=JSON.parse(t);
    const arr=Array.isArray(o)?o:(o.kc&&o.kc.sections)||o.sections||o.kcs;
    if(!Array.isArray(arr))throw new Error('This JSON file does not contain any Check Your Knowledge sections.');
    return{list:arr.map(normSec),from:'the JSON file'};
  }
  return readHTML(t,which);
}
function mergeIn(list){
  const cur=secs();let aS=0,aQ=0;
  list.forEach(s=>{
    let t=cur.find(x=>norm(x.name)===norm(s.name)&&norm(x.title)===norm(s.title))||cur.find(x=>String(x.id)===String(s.id)&&norm(x.name)===norm(s.name));
    if(!t){const c=JSON.parse(JSON.stringify(s));if(cur.some(x=>String(x.id)===String(c.id)))c.id='k'+Date.now().toString(36)+aS;cur.push(c);aS++;aQ+=c.questions.length;return}
    t.questions=t.questions||[];
    const have=new Set(t.questions.map(q=>norm(q.q)));let mx=Math.max(0,...t.questions.map(q=>+q.n||0));
    s.questions.forEach(q=>{if(have.has(norm(q.q)))return;t.questions.push(Object.assign({},q,{n:++mx}));have.add(norm(q.q));aQ++});
    if(!t.img&&s.img)t.img=s.img;
  });
  return{aS,aQ};
}
function applyImport(res){
  const q=l=>l.reduce((n,s)=>n+s.questions.length,0);
  if(!res.list.length){KS.msg='Nothing to import: no sections with questions were found in '+res.from+'.';KS.bad=true;return render()}
  if(KS.mode==='replace'){
    if(!confirm('Replace ALL current sections and questions with '+res.list.length+' sections / '+q(res.list)+' questions from '+res.from+'?\n\nAnything you edited or added here will be lost.'))return;
    D.kcs=JSON.parse(JSON.stringify(res.list));KS.sec=0;mark();
    KS.msg='Replaced everything with '+res.list.length+' sections and '+q(res.list)+' questions from '+res.from+'.';
  }else{
    const r=mergeIn(res.list);mark();
    KS.msg=(r.aS||r.aQ)?'Imported from '+res.from+': '+r.aS+' new section'+(r.aS===1?'':'s')+' and '+r.aQ+' new question'+(r.aQ===1?'':'s')+' added. Your existing edits were kept.':'Everything in '+res.from+' is already here, so nothing new was added.';
  }
  KS.bad=false;T(KS.msg.split('.')[0]+'.');render();
}
/* ----- bulk paste ----- */
function parseBulk(text){
  const out=[],warn=[];let missing=0;
  const rawBlocks=String(text).replace(/\r/g,'').split(/\n\s*\n+/).map(b=>b.trim()).filter(Boolean);
  const blocks=[];
  rawBlocks.forEach(b=>{let cur=[],seenOpt=false;b.split('\n').forEach(l=>{const t=l.trim();if(!t)return;const isOpt=/^\(?[A-Fa-f][\)\.\:]\s*\S/.test(t)||/^[-•]\s+\S/.test(t);
    if(seenOpt&&/^\d+[\.\)]\s+\S/.test(t)&&!isOpt){blocks.push(cur);cur=[];seenOpt=false}
    if(isOpt)seenOpt=true;cur.push(t)});if(cur.length)blocks.push(cur)});
  blocks.forEach((lines,bi)=>{
    const ql=[],opts=[];let ans=-1,why='',mode='q',mark=-1;
    lines.forEach(l=>{let m;
      if((m=/^(?:answer|ans|correct(?: answer)?)\s*[:=\-]\s*\(?([A-Fa-f]|\d)\)?/i.exec(l))){ans=/\d/.test(m[1])?(+m[1]-1):m[1].toUpperCase().charCodeAt(0)-65;mode='x';return}
      if((m=/^(?:why|explanation|because|reason)\s*[:\-]\s*(.*)$/i.exec(l))){why=m[1];mode='w';return}
      m=/^\(?[A-Fa-f][\)\.\:]\s*(.+)$/.exec(l)||/^[-•]\s+(.+)$/.exec(l);
      if(m){let t=m[1].trim(),ok=false;if(/(\*|✓|✔|\(correct\))\s*$/i.test(t)){ok=true;t=t.replace(/\s*(\*|✓|✔|\(correct\))\s*$/i,'')}if(/^\*\s*/.test(t)){ok=true;t=t.replace(/^\*\s*/,'')}if(ok)mark=opts.length;opts.push(t);mode='o';return}
      if(mode==='w')why+=' '+l;else if(mode==='o'&&opts.length)opts[opts.length-1]+=' '+l;else if(mode==='q')ql.push(l.replace(/^\d+[\.\)]\s*/,''))});
    const q=ql.join(' ').trim();
    if(!q||opts.length<2){warn.push('Block '+(bi+1)+' skipped: needs a question and at least two options.');return}
    if(ans<0&&mark>=0)ans=mark;
    if(ans<0||ans>=opts.length){ans=0;missing++;warn.push('Question "'+q.slice(0,50)+(q.length>50?'…':'')+'" has no clear answer marked: A was used. Fix it after adding.')}
    out.push({q,options:opts.slice(0,8),answer:ans,why:why.trim()});
  });
  return{qs:out,warn,missing};
}

async function uploadRepoFile(f,k){
 if(!LS.t||!LS.o||!LS.r)throw new Error('Connect to GitHub first (Connect & publish page).');
 if(f.size>25*1024*1024)throw new Error(f.name+' is larger than 25 MB.');
 const dir=((LS.p||'index.html').match(/^(.*\/)/)||['',''])[1];
 const safe=(f.name.replace(/[^A-Za-z0-9._-]+/g,'-').replace(/^[-.]+/,''))||'file';
 const rel='uploads/'+k+'/'+Date.now().toString(36)+'-'+safe;
 const buf=new Uint8Array(await f.arrayBuffer());let bin='';for(let i=0;i<buf.length;i+=8192)bin+=String.fromCharCode.apply(null,buf.subarray(i,i+8192));
 const r=await fetch('https://api.github.com/repos/'+LS.o+'/'+LS.r+'/contents/'+encodeURI(dir+rel),{method:'PUT',headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+LS.t,'Content-Type':'application/json'},body:JSON.stringify({message:'Upload '+f.name,content:btoa(bin),branch:LS.b||'main'})});
 const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error((j.message||('GitHub error '+r.status))+' ('+f.name+')');
 return rel}

  const d=E('details',{className:'card',style:'border-left:8px solid var(--c-curriculum)'});d.open=!!open[w];d.ontoggle=()=>open[w]=d.open;

<style id="cs-live-css">
.le-wrap{display:flex;flex-direction:column;gap:10px}
.le-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.le-bar .sp{flex:1}.le-bar .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.le-bar .seg button{border:0;background:var(--panel);color:var(--ink);padding:7px 11px;cursor:pointer;font:600 12px Inter}.le-bar .seg button.on{background:var(--acc);color:#fff}
.le-split{display:flex;gap:12px;align-items:stretch;height:calc(100vh - 235px);min-height:500px}
.le-stage{flex:1;min-width:0;background:var(--line);border-radius:14px;display:flex;justify-content:center;overflow:auto;padding:10px}
.le-stage iframe{border:0;background:#fff;border-radius:10px;height:100%;width:100%;transition:width .25s}
.le-panel{width:360px;flex:none;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.le-panel h4{margin:14px 0 6px;font:700 13px Poppins}.le-panel label{display:block;font-size:11.5px;color:var(--mut);margin:8px 0 3px}
.le-panel textarea{min-height:70px}.le-sw{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.le-sw i{width:24px;height:24px;border-radius:7px;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.le-row{display:flex;gap:8px;align-items:center}.le-row input[type=color]{width:46px;height:38px;padding:0;border:none;background:none;cursor:pointer}.le-row input[type=text]{flex:1}
.le-full{position:fixed;inset:0;z-index:150;background:var(--bg);padding:12px;overflow:auto}.le-full .le-split{height:calc(100vh - 100px)}
.le-pre{white-space:pre-wrap;font:11px/1.5 ui-monospace,monospace;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px;max-height:140px;overflow:auto;margin:8px 0 0}
.le-pre:empty{display:none}
.cc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.cc-cell{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--panel)}
.cc-prev{height:46px;border-radius:10px;background:var(--bg);border:4px solid var(--oc,var(--line));margin:8px 0;display:flex;align-items:center;padding:0 10px;font-size:12px;color:var(--mut)}
.cc-prev.def{border-style:dashed}
.ub-bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:90;background:#111827;color:#fff;border-radius:99px;padding:9px 12px 9px 18px;display:none;gap:12px;align-items:center;box-shadow:0 14px 40px rgba(0,0,0,.4);font:600 13px Inter}
.ub-bar.on{display:flex}.ub-bar button{border:0;border-radius:99px;padding:7px 14px;font:700 12px Inter;cursor:pointer}.ub-bar .p{background:var(--acc);color:#fff}.ub-bar .g{background:#2b303c;color:#fff}
.qa-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:0 0 14px}
.qa-t{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;text-align:left;color:var(--ink);font:inherit;transition:.15s}.qa-t:hover{transform:translateY(-2px);border-color:var(--acc)}
.qa-t b{display:block;font:700 14px Poppins;margin-top:4px}.qa-t span{font-size:11.5px;color:var(--mut)}.qa-t i{font-style:normal;font-size:20px}
@media(max-width:1000px){.le-split{flex-direction:column;height:auto}.le-stage{height:70vh}.le-panel{width:auto}}
</style>
