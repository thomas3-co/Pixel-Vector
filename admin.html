<script id="hmr">
/* ===== HMR · progress reconcile + badge engine (identical copy lives in the student site and the admin) =====
   1. normId      - turns old lesson ids ("1", "w2d1", "Week 2 Day 1", "2_1" ...) into today's ids ("2-1")
   2. reconcile   - keeps every previously finished lesson, and (once per student) credits weeks the student already
                    finished / submitted / took the quiz for. Nothing is ever removed; unknown ids are kept in legacyCompleted.
   3. visitDays   - days visited are kept IN the student record (not only on one device) and rebuilt from past activity.
   4. badgeCalc   - the same formula the student profile uses, so the admin shows exactly the badge the student wears.   */
(function(g){
  var DEF_BADGES=[{name:'Starter',color:'#b7791f',progress:0,result:0,visits:1},{name:'Explorer',color:'#8a94a6',progress:15,result:50,visits:3},{name:'Creator',color:'#e0a800',progress:40,result:65,visits:6},{name:'Designer',color:'#12b886',progress:70,result:80,visits:10},{name:'Master',color:'#8b5cf6',progress:100,result:90,visits:15}];
  function cmpId(a,b){var A=String(a).split('-').map(Number),B=String(b).split('-').map(Number);return (A[0]-B[0])||(A[1]-B[1]);}
  function iso(d){try{var x=new Date(d);return isNaN(x)?'':x.toISOString().slice(0,10);}catch(e){return '';}}
  function ctxOf(ids){var list=Array.from(new Set((ids||[]).map(String))).sort(cmpId),set={},byWeek={};list.forEach(function(i){set[i]=1;var w=i.split('-')[0];(byWeek[w]=byWeek[w]||[]).push(i);});return {list:list,set:set,byWeek:byWeek};}
  var RX=/^(?:week|wk|w|day|d|lesson|l)?[\s_#]*0*(\d{1,2})(?:[\s_.\-:\/\u00b7\u2013\u2014]+(?:(?:day|d|lesson|l)[\s_#\-]*)?|[\s_]*(?:day|d|lesson|l)[\s_#\-]*)0*(\d{1,2})$/;
  function normId(raw,ctx){
    if(raw==null)return null;var s=String(raw).trim().toLowerCase();if(!s)return null;if(ctx.set[s])return s;
    var m=RX.exec(s);if(m){var id=(+m[1])+'-'+(+m[2]);return ctx.set[id]?id:null;}
    if(/^\d+$/.test(s)){var n=+s;return (n>=1&&n<=ctx.list.length)?ctx.list[n-1]:null;}   /* old numbering 1,2,3 ... = lesson number */
    return null;
  }
  function weekNum(k){var m=/\d+/.exec(String(k));return m?String(+m[0]):null;}
  function activityDays(rec){
    var out={},add=function(v){var d=iso(v);if(d&&d>'2020')out[d]=1;};rec=rec||{};
    Object.keys(rec.weekFinished||{}).forEach(function(k){add(rec.weekFinished[k]);});
    Object.keys(rec.weekSubmissions||{}).forEach(function(k){var x=rec.weekSubmissions[k];add(x&&(x.at||x.date));});
    Object.keys(rec.weekQuizzes||{}).forEach(function(k){var x=rec.weekQuizzes[k];if(x)add(x.at||x.date||x.takenAt||x.completedAt);});
    var pa=rec.phaseAssessments||{};Object.keys(pa).forEach(function(k){add(pa[k]&&pa[k].completedAt);});
    ['createdAt','lastSavedAt','lastLogin'].forEach(function(k){if(rec[k])add(rec[k]);});
    return Object.keys(out);
  }
  function visitDays(rec,local){var s={};(rec.visitDays||[]).forEach(function(d){s[d]=1;});(local||[]).forEach(function(d){s[d]=1;});activityDays(rec).forEach(function(d){s[d]=1;});return Object.keys(s).sort();}
  /* sync: merge local-device days + activity into rec.visitDays; returns {count,changed} */
  function syncVisits(rec,local,today){
    var all=visitDays(rec,local);if(today&&all.indexOf(today)<0)all.push(today);all.sort();all=all.slice(-400);
    var changed=JSON.stringify(all)!==JSON.stringify(rec.visitDays||[]);if(changed)rec.visitDays=all;
    return {count:all.length,changed:changed};
  }
  /* reconcile(rec, ids, {dry}) -> report. Mutates rec unless dry. */
  function reconcile(rec,ids,opt){
    opt=opt||{};var ctx=ids&&ids.set?ids:ctxOf(ids);rec=rec||{};
    var before=(rec.completed||[]).length,effBefore=(rec.completed||[]).filter(function(x){return ctx.set[String(x).trim().toLowerCase()];}).length,done={},remapped=[],unmatched=[],credited=[];
    (rec.completed||[]).concat(rec.legacyCompleted||[]).forEach(function(x){var n=normId(x,ctx);if(n){if(String(x)!==n)remapped.push([String(x),n]);done[n]=1;}else if(unmatched.indexOf(String(x))<0)unmatched.push(String(x));});
    var already=(rec.migrated||0)>=2;
    if(!already&&opt.credit!==false){
      var ev={};
      Object.keys(rec.weekFinished||{}).forEach(function(k){if(rec.weekFinished[k]){var w=weekNum(k);if(w)(ev[w]=ev[w]||[]).push('week marked finished');}});
      Object.keys(rec.weekSubmissions||{}).forEach(function(k){var w=weekNum(k);if(w)(ev[w]=ev[w]||[]).push('weekly work submitted');});
      Object.keys(rec.weekQuizzes||{}).forEach(function(k){var w=weekNum(k);if(w)(ev[w]=ev[w]||[]).push('week quiz taken');});
      Object.keys(ev).forEach(function(w){(ctx.byWeek[w]||[]).forEach(function(id){if(!done[id]){done[id]=1;credited.push({id:id,why:ev[w][0]});}});});
    }
    var after=Object.keys(done).sort(cmpId);
    var changed=remapped.length>0||credited.length>0||after.length!==before||(unmatched.length>0&&JSON.stringify(unmatched)!==JSON.stringify(rec.legacyCompleted||[]))||(!already&&opt.credit!==false);
    if(!opt.dry){
      rec.completed=after;
      if(unmatched.length)rec.legacyCompleted=unmatched;else delete rec.legacyCompleted;
      if(credited.length){rec.autoCredited=Array.from(new Set((rec.autoCredited||[]).concat(credited.map(function(c){return c.id;}))));}
      if(!already&&opt.credit!==false){rec.migrated=2;rec.migratedAt=new Date().toISOString();}
    }
    return {changed:changed,before:before,effBefore:effBefore,after:after.length,remapped:remapped,unmatched:unmatched,credited:credited,already:already,ids:after};
  }
  function gradeOf(rec,T){
    rec=rec||{};var done=(rec.completed||[]).length,wq=rec.weekQuizzes||{},qs=Object.keys(wq),sum=0;
    qs.forEach(function(k){var q=wq[k]||{};sum+=q.total?(q.score/q.total)*100:100;});
    var comp=T.lessons?(done/T.lessons)*100:0,qa=qs.length?sum/qs.length:0;
    var rd=T.reading?Math.min(100,((rec.readingSeen||[]).length/T.reading)*100):0;
    var vc=Object.keys(rec.videoConfirmed||{}).filter(function(k){return rec.videoConfirmed[k];}).length;
    var vd=T.video?Math.min(100,(vc/T.video)*100):0;
    return {overall:Math.round(comp*.45+qa*.25+rd*.15+vd*.15),pct:T.lessons?Math.min(100,Math.round(done/T.lessons*100)):0,done:done,quizzes:qs.length};
  }
  function letter(o){return o>=97?'A+':o>=93?'A':o>=90?'A-':o>=87?'B+':o>=83?'B':o>=80?'B-':o>=77?'C+':o>=73?'C':o>=70?'C-':o>=67?'D+':o>=63?'D':o>=60?'D-':'NI';}
  function badgeCalc(vals,badges){
    var B=(badges&&badges.length)?badges:DEF_BADGES,cur=-1;
    B.forEach(function(b,i){if(vals.pct>=b.progress&&vals.res>=b.result&&vals.visits>=b.visits)cur=i;});
    var idx=Math.max(cur,0),nx=B[cur+1]||null;
    var need=nx?{progress:Math.max(0,nx.progress-vals.pct),result:Math.max(0,nx.result-vals.res),visits:Math.max(0,nx.visits-vals.visits)}:null;
    /* closeness to next badge: average of the three requirement ratios */
    var near=nx?Math.round(([nx.progress?Math.min(1,vals.pct/nx.progress):1,nx.result?Math.min(1,vals.res/nx.result):1,nx.visits?Math.min(1,vals.visits/nx.visits):1].reduce(function(a,b){return a+b;},0)/3)*100):100;
    return {earned:cur>=0,idx:idx,level:idx+1,total:B.length,badge:B[idx],next:nx,need:need,near:near};
  }
  function shield(color,z,on){return '<svg width="'+z+'" height="'+z+'" viewBox="0 0 24 24" aria-hidden="true" style="display:block;flex:none"><path d="M12 2 4 5v6c0 5 3.4 9.3 8 11 4.6-1.7 8-6 8-11V5z" fill="'+(on?color:'#9aa2b1')+'"/><path d="M12 2 4 5v6c0 .9.1 1.8.3 2.6L12 11z" fill="rgba(255,255,255,.22)"/><polygon points="12 7.2 13.4 10.4 16.9 10.7 14.3 13 15.1 16.4 12 14.6 8.9 16.4 9.7 13 7.1 10.7 10.6 10.4" fill="#fff"/></svg>';}
  /* Google Drive thumbnails: try several endpoints before giving up */
  function thumbChain(id,w){id=encodeURIComponent(id);w=w||640;return ['https://drive.google.com/thumbnail?id='+id+'&sz=w'+w,'https://lh3.googleusercontent.com/d/'+id+'=w'+w,'https://drive.google.com/uc?export=view&id='+id];}
  g.HMR={DEF_BADGES:DEF_BADGES,cmpId:cmpId,iso:iso,ctxOf:ctxOf,normId:normId,activityDays:activityDays,visitDays:visitDays,syncVisits:syncVisits,reconcile:reconcile,gradeOf:gradeOf,letter:letter,badgeCalc:badgeCalc,shield:shield,thumbChain:thumbChain};
})(typeof window!=='undefined'?window:globalThis);

</script>

 drawRoster();if(!TK)showGate('Sign in to load live student data.');else pollLive().then(drawRoster).catch(()=>{});
 rT=setInterval(()=>{if(cur!=='roster'){clearInterval(rT);return}if(TK&&!document.hidden)pollLive().then(drawRoster).catch(()=>{})},20000)}

function phasesView(){setOn('phases','Phase assessments');const v=$('#view');v.innerHTML='';const P=D.phases||(D.phases=[]);
 const h=E('div',{className:'card'});h.innerHTML='<h3>Phase assessments</h3><p class="hint">Phase 1 is the existing official bank. Add Phase 2, Phase 3 and more below: each has its own questions, unlock week, number of questions drawn per student, and release switch. Students see released phases on their Phase Assessment tab.</p>';
 const p1=E('div',{className:'ph28'});p1.innerHTML='<b>Phase 1 Assessment</b> · '+(D.assessments||[]).length+' questions in the bank';const e1=E('button',{className:'b mini',textContent:'Open Phase 1 question bank',style:'margin-left:10px'});e1.onclick=()=>go('assessments');p1.append(e1);h.append(p1);
 const add=E('button',{className:'b p',textContent:'+ Add another phase assessment'});add.onclick=()=>{const n=Math.max(1,...P.map(x=>+String(x.id).replace(/\D/g,'')||1))+1;P.push({id:'phase'+n,title:'Phase '+n+' Assessment',desc:'',unlockWeek:n*5,draw:15,marks:1,released:false,questions:[]});mark();phasesView()};h.append(add);v.append(h);
 P.forEach((ph,pi)=>{const c=E('div',{className:'ph28'});ph.questions=ph.questions||[];
  c.innerHTML=`<div class="row"><div><label>Title</label><input type="text" value="${esc(ph.title)}" data-k="title"></div><div><label>Unlocks in week</label><input type="number" value="${ph.unlockWeek||1}" data-k="unlockWeek"></div><div><label>Questions per student (0 = all)</label><input type="number" value="${ph.draw||0}" data-k="draw"></div><div><label>Marks per question</label><input type="number" value="${ph.marks||1}" data-k="marks"></div></div><label>Description shown to students</label><textarea data-k="desc">${esc(ph.desc||'')}</textarea><label class="chk"><input type="checkbox" ${ph.released?'checked':''} data-k="released"> Released to students (${ph.questions.length} questions)</label>`;
  c.querySelectorAll('[data-k]').forEach(i=>i.oninput=i.onchange=()=>{const k=i.dataset.k;ph[k]=i.type==='checkbox'?i.checked:i.type==='number'?+i.value:i.value;mark()});
  const qs=E('div');ph.questions.forEach((q,qi)=>{q.opts=q.opts||['','','',''];const d=E('details');d.innerHTML=`<summary><span>${qi+1}. ${esc((q.q||'(empty question)').slice(0,90))}</span></summary>`;const in_=E('div',{className:'in'});in_.innerHTML=`<label>Question</label><textarea>${esc(q.q)}</textarea>`;in_.firstElementChild.nextElementSibling.oninput=e=>{q.q=e.target.value;mark()};
   q.opts.forEach((o,oi)=>{const r=E('div',{className:'row',style:'margin-top:6px'});const rad=E('input',{type:'radio',name:'pc'+pi+'_'+qi,checked:Number(q.a)===oi});rad.style.cssText='flex:none;min-width:0;width:auto';rad.onchange=()=>{q.a=oi;mark()};const t=E('input',{type:'text',value:o,placeholder:'Option '+LET[oi]});t.oninput=()=>{q.opts[oi]=t.value;mark()};r.append(rad,t);in_.append(r)});
   const del=E('button',{className:'b mini d',textContent:'Delete question',style:'margin-top:8px'});del.onclick=()=>{ph.questions.splice(qi,1);mark();phasesView()};in_.append(del);d.append(in_);qs.append(d)});c.append(qs);
  const row2=E('div',{className:'row',style:'margin-top:10px'});
  const aq=E('button',{className:'b',textContent:'+ Add question'});aq.onclick=()=>{ph.questions.push({q:'',opts:['','','',''],a:0});mark();phasesView()};
  const im=E('button',{className:'b p',textContent:'Import from document'});im.onclick=()=>importModal({title:'Import into '+ph.title,apply:l=>{l.forEach(x=>{const o=x.opts.slice(0,4);while(o.length<4)o.push('');ph.questions.push({q:x.q,opts:o,a:Math.min(3,Math.max(0,x.a))})});return l.length}});
  const dl=E('button',{className:'b d',textContent:'Delete this phase'});dl.onclick=()=>{if(confirm('Delete '+ph.title+' and all its questions?')){P.splice(pi,1);mark();phasesView()}};
  row2.append(aq,im,dl);c.append(row2);v.append(c)});
 if(!P.length)v.append(E('div',{className:'cs27-callout',textContent:'No extra phases yet. Press "+ Add another phase assessment".'}))}

function impBuiltInNotes(){
 if(!src)return 0;
 const doc=new DOMParser().parseFromString(src,'text/html');D.notes=D.notes||[];let n=0;
 doc.querySelectorAll('.note-section[id]').forEach(sec=>{
  if(D.notes.some(x=>x.id===sec.id))return;
  const h3=sec.querySelector('h3'),badge=((h3&&h3.querySelector('.week-badge'))||{}).textContent||'';let title='';
  if(h3){const c=h3.cloneNode(true);c.querySelectorAll('.week-badge').forEach(x=>x.remove());title=c.textContent.replace(/\s+/g,' ').replace(/^[\s·\-–—]+/,'').trim()}
  const wm=/(\d+)/.exec(badge),introEl=[...sec.children].find(el=>el.tagName==='P');
  const cards=[...sec.querySelectorAll('.readme-lesson-card')].map(c=>{const ps=[...c.querySelectorAll('p')].map(p=>p.textContent.replace(/\s+/g,' ').trim()).filter(Boolean),steps=[...c.querySelectorAll('.note-steps li')].map((li,i)=>(i+1)+'. '+li.textContent.replace(/\s+/g,' ').trim());return{title:((c.querySelector('h4')||{}).textContent||'').trim(),text:[...new Set(ps)].concat(steps).join('\n')}});
  D.notes.push({id:sec.id,week:wm?+wm[1]:'',badge:badge.trim(),title,intro:introEl?introEl.textContent.replace(/\s+/g,' ').trim():'',quiz:true,hidden:false,tip:'',cards,vocab:[]});n++});
 if(n)mark();return n}
/* ---------- 5. Hook import into Quiz Studio / Assessment Studio, add nav entries ---------- */
const prevGo=go;
go=function(k){
 if(k==='roster')return rosterView();if(k==='phases')return phasesView();
 const r=prevGo(k);
 try{if(k==='quizzes'){const v=$('#view');v.insertBefore(importBar('Import quiz questions (Read Me pop-out quiz, screencast quiz)',l=>{const t=$('#i28s').value;let key=$('#i28k').value.trim(),type=$('#i28y').value;if(t==='__new'){if(!key)throw new Error('Type the Read Me note id or screencast id for the new set.')}else{const[a,b]=t.split('|');type=a;key=b}
   let set=D.quizzes.find(x=>x.type===type&&x.key===key);if(!set){set={type,key,questions:[]};D.quizzes.push(set)}l.forEach(x=>set.questions.push({q:x.q,options:x.opts.slice(0,6),answer:Math.max(0,x.a)}));return l.length},o=>{o.innerHTML='<select id="i28s">'+D.quizzes.map(x=>'<option value="'+esc(x.type+'|'+x.key)+'">'+(x.type==='reading'?'Read Me pop-out':'Screencast quiz')+': '+esc(x.key)+' ('+(x.questions||[]).length+')</option>').join('')+'<option value="__new">New quiz set...</option></select><select id="i28y"><option value="reading">Read Me quiz</option><option value="video">Screencast quiz</option></select><input type="text" id="i28k" placeholder="note id / screencast id (new set only)">'}),v.children[1]||null)}
 if(k==='assessments'){const v=$('#view');v.insertBefore(importBar('Import Phase 1 assessment questions',l=>{const w=+$('#i28w').value||1;l.forEach(x=>{const o=x.opts.slice(0,4);while(o.length<4)o.push('');D.assessments.push({week:w,marks:1,q:x.q,opts:o,a:Math.min(3,Math.max(0,x.a))})});return l.length},o=>{o.innerHTML='<label style="margin:0">Source week</label><input type="number" id="i28w" value="1" min="1" max="16">'}),v.children[1]||null)}}catch(e){console.error(e)}
 try{if(k==='notes'||k==='items'||k==='projects'){const top=document.querySelector('#view .card');if(top){const bar=E('div',{className:'row',style:'margin:8px 0;padding:10px;border:1px dashed var(--acc);border-radius:12px'});bar.innerHTML='<b style="flex:none">Previously published content</b>';
   if(k==='notes'){const x=E('button',{className:'b p',textContent:'Make built-in Read Me notes editable',style:'flex:none'});x.onclick=()=>{if(!confirm('Copy every built-in Read Me note that is not already in the editor, so you can edit it? Imported notes use the standard card layout (text and numbered steps). For pixel-exact edits use Site explorer instead.'))return;const n=impBuiltInNotes();toast(n?n+' note(s) imported - edit them below':'All built-in notes are already in the editor');go('notes')};bar.append(x)}
   if(k==='items'){const x=E('button',{className:'b p',textContent:'Load screencasts already on the site',style:'flex:none'});x.onclick=()=>{try{importSite(['screencasts']);go('items')}catch(e){toast(e.message)}};bar.append(x)}
   if(k==='projects'){const x=E('button',{className:'b p',textContent:'Edit built-in project pages (site explorer)',style:'flex:none'});x.onclick=()=>go('explorer');bar.append(x)}
   const y=E('button',{className:'b',textContent:'Edit any published page text (site explorer)',style:'flex:none'});y.onclick=()=>go('explorer');bar.append(y);top.insertBefore(bar,top.children[1]||null)}}}catch(e){console.error(e)}
 return r};
const g=[...document.querySelectorAll('#nav .cs27-group')];
const gc=g.find(x=>x.textContent.indexOf('Course content')>-1),gs=g.find(x=>x.textContent.indexOf('Student operations')>-1);
const mk=(k,l,ic)=>{const b=E('button',{textContent:l});b.dataset.k=k;b.dataset.icon=ic;b.onclick=()=>go(k);return b};
if(gs)gs.children[1]?gs.children[1].before(mk('roster','All students (control list)','♙')):gs.append(mk('roster','All students (control list)','♙'));
if(gc){const a=[...gc.querySelectorAll('button')].find(b=>b.dataset.k==='assessments');const b=mk('phases','Phase assessments (add more)','✓');a?a.after(b):gc.append(b)}
}catch(e){console.error('Course Studio 28 failed',e)}})();
