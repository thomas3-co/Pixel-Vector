<style>

@media(prefers-color-scheme:dark){:root{--bg:#0f1116;--panel:#1a1d26;--ink:#eef0f6;--mut:#9aa2b1;--line:#2b303c}}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
h1,h2,h3{font-family:Poppins,sans-serif;margin:0}
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav{background:var(--side);color:#cfd4e0;padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto}
nav h1{font-size:16px;color:#fff;padding:4px 10px 14px}nav button{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;padding:9px 12px;border-radius:9px;font:500 13.5px Inter;cursor:pointer}
nav button:hover{background:#252934}nav button.on{background:var(--acc);color:#fff}nav hr{border:0;border-top:1px solid #2b303c;margin:10px 0}
main{padding:0 26px 60px;max-width:1100px;width:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:10px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line);margin-bottom:18px}
header h2{flex:1;font-size:20px}.chip{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--line)}.chip.dirty{background:#ffe8cc;color:#9a4b00}
button.b{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:9px;font:600 13px Inter;cursor:pointer}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}button.d{color:var(--bad)}button.b:hover{filter:brightness(.96)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-weight:600;font-size:12.5px;margin:12px 0 4px;color:var(--mut)}
input[type=text],input[type=number],input[type=password],textarea,select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:70px;resize:vertical}textarea.code{font:12px/1.45 ui-monospace,Menlo,monospace;min-height:340px}
input[type=color]{width:46px;height:34px;border:1px solid var(--line);border-radius:8px;padding:2px;background:none}
details{border:1px solid var(--line);border-radius:12px;margin:8px 0;background:var(--panel)}summary{cursor:pointer;padding:10px 14px;font-weight:600;display:flex;gap:8px;align-items:center}
summary span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.in{padding:0 14px 14px;border-top:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:140px}.chk{display:flex;gap:8px;align-items:center;margin-top:12px;font-weight:600}.chk input{width:auto}
.mini{padding:3px 8px!important;font-size:12px!important;min-width:0!important;flex:none!important}
.hint{color:var(--mut);font-size:12.5px;margin:4px 0}.log{font:12px ui-monospace,monospace;white-space:pre-wrap;background:var(--bg);border-radius:9px;padding:10px;max-height:220px;overflow:auto}
.warn{color:#9a4b00}.ok{color:var(--ok)}#pv{width:100%;height:78vh;border:1px solid var(--line);border-radius:12px;background:#fff}
.ty{font-size:11px;padding:2px 9px;border-radius:99px;color:#fff;font-weight:600;flex:none}.th{width:64px;height:38px;object-fit:cover;border-radius:6px;background:var(--line);flex:none}
details.dragover{outline:2px dashed var(--acc)}details[draggable=true]{opacity:.85}.tb{width:100%;border-collapse:collapse}.tb th,.tb td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.tb tr.r{cursor:pointer}.tb tr.r:hover{background:var(--bg)}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}.tg div{background:var(--bg);border-radius:10px;padding:10px}.tg b{display:block;font-size:20px;font-family:Poppins}
@media(max-width:800px){#app{grid-template-columns:1fr}nav{position:static;height:auto;display:flex;flex-wrap:wrap}nav button{width:auto}nav hr{display:none}}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script></head><body>
<div id="app"><nav id="nav"></nav><main><header><h2 id="ttl"></h2><span class="chip" id="st">Not connected</span><button class="b" id="bpv">Preview</button><button class="b p" id="bpub">Publish</button></header><div id="view"></div></main></div>
<script>
/* ===== state ===== */
const $=(s,r=document)=>r.querySelector(s),E=(t,a={},h='')=>{const e=document.createElement(t);Object.assign(e,a);if(h)e.innerHTML=h;return e};
let src='',sha='',D={},dirty=false,cur='site',LS=JSON.parse(localStorage.getItem('cs_gh')||'{}');
const GAS_BACKEND_URL='<?= backendUrl ?>';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function mark(v=true){dirty=v;applyTheme();const s=$('#st');s.textContent=src?(v?'Unpublished changes':'Up to date'):'Not connected';s.className='chip'+(v?' dirty':'')}
/* ===== field specs: [key,label,type,extra] ===== */
const PAIR=['term','def'];
const DAY=[['type','Type','s',['lesson','project','practice']],['title','Card title'],['front','Front of card','a'],['idea','Back: big idea (**bold**, lines starting "- " = bullets)','a'],['vocab','Vocabulary — one per line: term | definition','pairs',PAIR],['links','Links — one per line: kind | ref | label (kind = screencast, note, project, url)','pairs',['kind','ref','label']]];
const SPEC={
weeks:[['n','Week number','n'],['title','Title (e.g. Week 6 — Retouching)'],['short','Short name'],['days','Days','sub',DAY,d=>d.title||'New day',()=>({type:'lesson',title:'',front:'',idea:'',vocab:[],links:[]})]],
items:[['id','Google Drive file ID'],['title','Title'],['desc','Description','a'],['order','Order','n'],['group','Group id'],['phase','Phase','n'],['released','Released to students','b'],['graded','Graded','b'],['vocab','Vocabulary — term | definition','pairs',PAIR]],
groups:[['id','Group id'],['title','Title'],['sub','Subtitle'],['color','Colour','c'],['badge','Badge text']],
notes:[['id','Note id (e.g. readme-week6)'],['week','Week','n'],['badge','Badge (e.g. WEEK 6)'],['title','Title'],['intro','Intro','a'],['quiz','Has quiz + Mark as Read','b'],['hidden','Hide this note','b'],['tip','Tip box','a'],['cards','Cards','sub',[['title','Card title'],['text','Text','a']],c=>c.title||'New card',()=>({title:'',text:''})],['vocab','Vocabulary — term | definition','pairs',PAIR]],
quizzes:[['type','Type','s',['reading','video']],['key','Key (Read Me note id, or screencast id)'],['questions','Questions (need 5+, students get 5 random)','sub',[['q','Question','a'],['options','Options — one per line','lines'],['answer','Correct option number (0 = first line)','n']],q=>q.q||'New question',()=>({q:'',options:['','','',''],answer:0})]],
projects:[['id','Project id'],['week','Week','n'],['title','Title'],['desc','Brief','a'],['skills','Skills (comma separated)','csv'],['checks','Checklist — one per line','lines'],['classroomUrl','Classroom / submission link'],['section','Section (e.g. Phase One)'],['marks','Marks','n'],['hidden','Hide project','b']],
assessments:[['week','Source week','n'],['q','Question','a'],['opts','Four answer options — one per line','lines'],['a','Correct option number (0 = first)','n']],
files:[['id','Google Drive file ID'],['label','Label']],
deadlines:[['title','Deadline title'],['date','Date (YYYY-MM-DD)'],['kind','Colour category','s',['project','practice','exam','other']],['week','Week number','n'],['note','Short note']],
resources:[['title','Resource title'],['url','HTTPS link'],['desc','Description'],['kind','Category']],
faq:[['q','Question','a'],['a','Answer','a']]};
const SECT={
site:{t:'Home & brand text',f:()=>[[D.site,[['brandName','Brand name'],['brandSub','Brand subtitle'],['heroEyebrow','Small line above heading'],['heroTitle','Home heading'],['heroText','Home paragraph','a'],['stats','Home boxes (up to 4) — number | label','pairs',['num','label']],['tabs','Rename tabs — one per line: key = name (curriculum, projects, notes, screencasts, practice, materials, assessment, progress)','map']]]]},
weeks:{t:'Curriculum weeks',l:'weeks',a:'Import built-in week…',mk:()=>({n:'',title:'',short:'',days:[]}),ti:w=>'Week '+w.n+' — '+(w.title||''),imp:1},
items:{t:'Screencasts',l:'items',mk:()=>({id:'',title:'',desc:'',released:true,graded:false,phase:1,vocab:[]}),ti:x=>x.title||x.id||'New screencast',sw:'released'},
groups:{t:'Screencast groups',l:'groups',mk:()=>({id:'',title:'',sub:'',color:'#2f6fed'}),ti:x=>x.title||'New group'},
notes:{t:'Read Me notes',l:'notes',mk:()=>({id:'',week:'',cards:[],vocab:[],quiz:true}),ti:x=>(x.badge||'')+' '+(x.title||x.id||'New note'),sw:'hidden'},
quizzes:{t:'Assessment quizzes',l:'quizzes',mk:()=>({type:'reading',key:'',questions:[]}),ti:x=>x.type+' · '+(x.key||'new')+' ('+(x.questions||[]).length+' q)'},
projects:{t:'Projects',l:'projects',mk:()=>({id:'',skills:[],checks:[]}),ti:x=>x.title||x.id||'New project',sw:'hidden'},
assessments:{t:'Phase 1 assessment question bank',l:'assessments',mk:()=>({week:1,marks:1,source:'',q:'',opts:['','','',''],a:0}),ti:x=>'Week '+(x.week||'?')+' · '+(x.q||'New assessment question')},
materials:{t:'Additional materials',l:'materials',sp:'files',mk:()=>({id:'',label:''}),ti:x=>x.label||x.id||'New file'},
practice:{t:'Practice files',l:'practice',sp:'files',mk:()=>({id:'',label:''}),ti:x=>x.label||x.id||'New file'},
deadlines:{t:'Deadlines',l:'deadlines',mk:()=>({title:'',date:'',kind:'project',week:'',note:''}),ti:x=>(x.date||'No date')+' · '+(x.title||'New deadline')},
resources:{t:'Quick links & resources',l:'resources',mk:()=>({title:'',url:'',desc:'',kind:'Link'}),ti:x=>x.title||'New resource'},
faq:{t:'Student FAQ',l:'faq',mk:()=>({q:'',a:''}),ti:x=>x.q||'New question'},
progressReset:{t:'Student Progress Reset'},profile:{t:'Badges & profile',f:()=>[[D.profile,[['side','Profile side','s',['left','right']],['accents','Accent colours (comma separated)','csv'],['badges','The 5 badges','sub',[['name','Name'],['color','Colour','c'],['progress','Lessons finished %','n'],['result','Score %','n'],['visits','Days visited','n']],b=>b.name||'Badge',()=>({name:'',color:'#2f6fed',progress:0,result:0,visits:1})]]]]},
access:{t:'Login & sign-out',f:()=>[[D.session,[['idleMinutes','Auto sign-out after (minutes idle)','n'],['warnMinutes','Warn this many minutes before','n']]],[D.login,[['brandLine','Login screen top line'],['notes','Notes under the login button — one per line','lines']]]]},
theme:{t:'Site colours',f:()=>[[D.theme,[['curriculum','Curriculum and lessons','c'],['projects','Projects','c'],['practice','Practice','c'],['notes','Read Me notes','c'],['screen','Screencasts','c']]]]},import:{t:'Import from spreadsheet'},students:{t:'Students'},records:{t:'Help, announcements and log'},source:{t:'Source editor'},publish:{t:'Connect & publish'}};
/* ===== codecs ===== */
const enc={csv:v=>(v||[]).join(', '),lines:v=>(v||[]).join('\n'),pairs:(v,k)=>(v||[]).map(o=>k.map(x=>o[x]??'').join(' | ')).join('\n'),map:v=>Object.entries(v||{}).map(([a,b])=>a+' = '+b).join('\n')};
const dec={csv:t=>t.split(',').map(s=>s.trim()).filter(Boolean),lines:t=>t.split('\n').map(s=>s.trim()).filter(Boolean),
pairs:(t,k)=>t.split('\n').filter(l=>l.trim()).map(l=>{const p=l.split('|').map(s=>s.trim()),o={};k.forEach((x,i)=>o[x]=i==k.length-1?p.slice(i).join(' | '):(p[i]||''));return o}),
map:t=>Object.fromEntries(t.split('\n').filter(l=>l.includes('=')).map(l=>{const i=l.indexOf('=');return[l.slice(0,i).trim(),l.slice(i+1).trim()]}))};
/* ===== generic renderer ===== */
function form(root,o,spec){spec.forEach(f=>{const[k,l,t,x,ti,mk]=f;
 if(t=='b'){const w=E('label',{className:'chk'});const c=E('input',{type:'checkbox',checked:o[k]!==false&&!!o[k]});c.onchange=()=>{o[k]=c.checked;mark()};w.append(c,l);root.append(w);return}
 root.append(E('label',{},esc(l)));
 if(t=='sub'){o[k]=o[k]||[];list(root,o[k],x,ti,mk,1);return}
 let c;
 if(t=='a'||enc[t]){c=E('textarea');c.value=enc[t]?enc[t](o[k],x):(o[k]??'')}
 else if(t=='s'){c=E('select',{},x.map(v=>`<option>${v}</option>`).join(''));c.value=o[k]||x[0]}
 else{c=E('input',{type:t=='n'?'number':t=='c'?'color':'text'});c.value=o[k]??(t=='c'?'#2f6fed':'')}
 c.oninput=c.onchange=()=>{o[k]=enc[t]?dec[t](c.value,x):t=='n'?(c.value===''?'':Number(c.value)):c.value;mark()};
 root.append(c)})}
function list(root,arr,spec,ti,mk,nested,sw){
 const box=E('div');root.append(box);let dragI=null;
 const draw=()=>{box.innerHTML='';arr.forEach((it,i)=>{
  const d=E('details'),s=E('summary'),sp=E('span');sp.textContent=ti(it,i);
  const hd=E('span',{className:'b mini',textContent:'Drag',title:'Drag to reorder'});hd.style.cursor='grab';hd.onmousedown=()=>d.draggable=true;hd.onmouseup=()=>d.draggable=false;s.append(hd);
  d.ondragstart=e=>{dragI=i;e.dataTransfer.setData('text','x')};d.ondragend=()=>{d.draggable=false;d.classList.remove('dragover')};
  d.ondragover=e=>{if(dragI!=null){e.preventDefault();d.classList.add('dragover')}};d.ondragleave=()=>d.classList.remove('dragover');
  d.ondrop=e=>{e.preventDefault();if(dragI==null||dragI==i)return;const[m]=arr.splice(dragI,1);arr.splice(i,0,m);dragI=null;mark();draw()};
  const tc={lesson:'curriculum',project:'projects',practice:'practice'}[it.type];if(tc){const y=E('span',{className:'ty',textContent:it.type});y.style.background='var(--c-'+tc+')';s.append(y)}
  if(spec===SPEC.items&&it.id){const im=E('img',{className:'th',loading:'lazy',src:'https://drive.google.com/thumbnail?id='+encodeURIComponent(it.id)+'&sz=w200'});im.onerror=()=>im.remove();s.append(im)}
  if(spec===SPEC.notes||spec===SPEC.quizzes){const y=E('span',{className:'ty',textContent:spec===SPEC.notes?'read me':'quiz'});y.style.background='var(--c-notes)';s.append(y)}
  s.append(sp);
  const btn=(txt,fn,cls='',tip)=>{const b=E('button',{className:'b mini '+cls,textContent:txt,title:tip||txt});b.onclick=e=>{e.preventDefault();e.stopPropagation();fn()};s.append(b)};
  btn('Up',()=>{if(i){[arr[i-1],arr[i]]=[arr[i],arr[i-1]];mark();draw()}},'','Move up');btn('Down',()=>{if(i<arr.length-1){[arr[i+1],arr[i]]=[arr[i],arr[i+1]];mark();draw()}},'','Move down');
  btn('Copy',()=>{arr.splice(i+1,0,JSON.parse(JSON.stringify(it)));mark();draw()},'','Copy');btn('Delete',()=>{if(confirm('Delete this item?')){arr.splice(i,1);mark();draw()}},'d','Delete');
  const inn=E('div',{className:'in'});form(inn,it,spec);d.append(s,inn);d.ontoggle=()=>{};box.append(d);
  const t=()=>{sp.textContent=ti(it,i)};inn.addEventListener('input',t);inn.addEventListener('change',t)});
  if(!arr.length)box.append(E('p',{className:'hint'},'Nothing here yet.'))};
 draw();const a=E('button',{className:'b',textContent:'Add item'});a.onclick=()=>{arr.push(mk());mark();draw();box.lastChild.open=true};root.append(a);return draw}
/* ===== views ===== */
function go(k){cur=k;$('#ttl').textContent=SECT[k].t;document.querySelectorAll('nav button[data-k]').forEach(b=>b.classList.toggle('on',b.dataset.k==k));
 const v=$('#view');v.innerHTML='';const S=SECT[k];
 if(!src&&k!='publish'&&k!='students'&&k!='records'){v.append(E('div',{className:'card'},'<b>Connect first.</b> Open <i>Connect & publish</i> and load your index.html from GitHub (or upload it).'));return}
 if(k=='progressReset')return progressResetView(v);if(k=='records')return recView(v);if(k=='source')return srcView(v);if(k=='import')return impView(v);if(k=='students')return stuView(v);if(k=='publish')return pubView(v);
 if(S.f){S.f().forEach(([o,sp])=>{const c=E('div',{className:'card'});form(c,o,sp);v.append(c)});return}
 const top=E('div',{className:'card'});v.append(top);
 top.append(E('p',{className:'hint'},{weeks:'Weeks here are layered over the built-in course. Same week number = replaced. Use “Import built-in week” to start from what is on the site now.',items:'Same Drive ID as a built-in recording = renamed/updated. Untick “Released” to hide it from students.',notes:'Same note id as a built-in note replaces it; use Hide to remove it from students.',quizzes:'These are the pop-out quizzes attached to individual Read Me notes and screencasts. Each quiz needs at least five questions; students receive five random questions.',assessments:'Edit the official Phase Assessment question bank. Keep four options and set the correct option index from 0 to 3. Publishing updates the real PHASE1_QUESTIONS array in the main-site HTML.'}[k]||''));
 if(S.imp){const b=E('button',{className:'b',textContent:'Import one built-in week'});b.onclick=()=>impWeek(()=>go(k));const b2=E('button',{className:'b p',textContent:'Import all built-in weeks',style:'margin-left:8px'});b2.onclick=()=>impWeek(()=>go(k),1);top.append(b,b2)}
 list(top,D[S.l],SPEC[S.sp||S.l],S.ti,S.mk)}
function impWeek(done,all){
 const doc=new DOMParser().parseFromString(src,'text/html');
 const one=n=>{const c=doc.getElementById('week'+n);if(!c)return 0;
  const days=[...c.querySelectorAll('.flip-card')].map(f=>{const bk=f.querySelector('.flip-card-back'),t=f.classList.contains('project-day')?'project':f.classList.contains('practice-day')?'practice':'lesson';
   const links=[...f.querySelectorAll('.ll[onclick]')].map(b=>{const m=/(hmOpenScreencast|hmOpenReadMe|hmOpenProject)\('([^']+)'\)/.exec(b.getAttribute('onclick'));return m?{kind:{hmOpenScreencast:'screencast',hmOpenReadMe:'note',hmOpenProject:'project'}[m[1]],ref:m[2],label:''}:null}).filter(Boolean);
   return{type:t,title:f.querySelector('h4')?.textContent.trim()||'',front:f.querySelector('.flip-card-front p')?.textContent.trim()||'',idea:(bk.querySelector('.big-ideas')?.textContent||'').trim(),
    vocab:[...bk.querySelectorAll('.vocab')].map(s=>({term:s.textContent.trim(),def:s.dataset.def||''})),links}});
  D.weeks=D.weeks.filter(w=>String(w.n)!=n);D.weeks.push({n:Number(n),title:c.querySelector('h2.wk')?.textContent.trim(),short:'',days});return 1};
 let got=0;if(all){if(!confirm('Import every built-in week into the editor? Existing edited weeks with the same number are replaced.'))return;for(let n=1;n<=30;n++)got+=one(n)}
 else{const n=prompt('Import which built-in week number (1–16)?');if(!n)return;if(!one(n))return alert('Week '+n+' not found in index.html');got=1}
 D.weeks.sort((a,b)=>a.n-b.n);mark();done(got)}
/* ===== spreadsheet import + students ===== */
let ST={},EX={};
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open('cs',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const idbGet=async k=>{const d=await idb();return new Promise((ok,no)=>{const q=d.transaction('k').objectStore('k').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})};
const idbSet=async(k,v)=>{const d=await idb();return new Promise((ok,no)=>{const t=d.transaction('k','readwrite');t.objectStore('k').put(v,k);t.oncomplete=ok;t.onerror=()=>no(t.error)})};
const saveST=async()=>{try{await idbSet('students',ST);await idbSet('extra',EX)}catch(e){alert('This browser could not store the student data.')}};
const stReady=(async()=>{try{ST=(await idbGet('students'))||{};EX=(await idbGet('extra'))||{};if(!Object.keys(ST).length){const o=JSON.parse(localStorage.getItem('cs_students')||'{}');if(Object.keys(o).length){ST=o;await saveST()}}}catch(e){}})();
const addSt=(e,o)=>{e=String(e||'').toLowerCase().trim();if(e)ST[e]=Object.assign(ST[e]||{email:e},o)};
const COURSE_START=new Date('2026-09-14T00:00:00'),curWeek=()=>Math.floor((Date.now()-COURSE_START)/(7*864e5))+1;
const dt=x=>x instanceof Date?x.toISOString().slice(0,10):String(x||'').slice(0,10);
function calc(r){r=r||{};const done=(r.completed||[]).length,wq=r.weekQuizzes||{};let sc=0,pc=0,n=0;Object.values(wq).forEach(q=>{sc+=+q.score||0;n++;pc+=q.total?q.score/q.total*100:100});
 const rd=(r.readingSeen||[]).length,vw=Object.keys(r.videoConfirmed||{}).filter(k=>r.videoConfirmed[k]).length;
 const ov=Math.round(done/32*100*.45+(n?pc/n:0)*.25+Math.min(100,rd/5*100)*.15+Math.min(100,vw/9*100)*.15);
 const cw=curWeek(),subs=r.weekSubmissions||{};let due=0,dn=0;for(let w=5;w<=Math.min(cw,16);w++){due++;if(subs[w])dn++}
 return{overall:ov,letter:ov>=90?'A':ov>=80?'B':ov>=70?'C':ov>=60?'D':'Needs work',lessons:done,wq:sc+'/15',weeklyDone:dn,weeklyDue:due}}
const readWb=async f=>XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true});

 const show=()=>{const email=$('#rstudent').value,box=$('#rprofile');box.innerHTML='';if(!email)return;const st=ST[email]||{},rec=st.rec||{};const card=E('div',{style:'margin-top:16px'});card.innerHTML='<div class="tg"><div><b>'+esc(st.name||'Student')+'</b>Name</div><div><b>'+esc(email)+'</b>Email</div><div><b>'+((rec.completed||[]).length)+'</b>Completed lessons</div><div><b>'+Object.keys(rec.weekQuizzes||{}).length+'</b>Weekly quiz records</div></div><h3 style="margin:20px 0 8px">Choose what to reset</h3><p class="hint">Each action resets only its category. “All course progress” is separate and more comprehensive.</p>';
 scopes.forEach(([key,title,desc])=>{const row=E('div',{className:'row',style:'padding:12px 0;border-bottom:1px solid var(--line)'});row.innerHTML='<div style="min-width:240px"><b>'+esc(title)+'</b><div class="hint">'+esc(desc)+'</div></div><button class="b '+(key==='all'?'d':'')+'" data-scope="'+key+'" style="flex:none">Reset</button>';card.append(row)});
 const hist=(EX.resetHistory||[]).filter(x=>String(x.email||'').toLowerCase()===email).slice(-8).reverse();if(hist.length){card.append(E('h4',{style:'margin-top:18px'},'Recent reset history'));const t=E('div',{className:'log'});t.textContent=hist.map(x=>(x.at||'')+' · '+(x.summary||x.by||'Reset')).join('\n');card.append(t)}
 box.append(card);
 card.querySelectorAll('[data-scope]').forEach(btn=>btn.onclick=async()=>{const scope=btn.dataset.scope,label=scopes.find(x=>x[0]===scope)[1];if(!TK){msg('Connect to the backend first.');return}if(!confirm('Confirm: '+label+' for '+(st.name||email)+'? This action is recorded and the student is notified.'))return;btn.disabled=true;btn.textContent='Resetting…';msg('Sending reset request…');try{const j=await bk('adminReset',{email,scope});if(!j.ok)throw new Error(j.message||j.error||'Reset failed');msg(label+' reset successfully for '+email+'. Student notification sent.');const local=ST[email]||(ST[email]={email,name:st.name||''});local.rec=local.rec||{};const rr=local.rec;if(scope==='all'){local.rec={};}else if(scope==='curriculum'){rr.completed=[];rr.weekFinished={};}else if(scope==='readme'){rr.readingSeen=[];rr.contentQuizzes=rr.contentQuizzes||{};rr.contentQuizzes.reading={};}else if(scope==='screencasts'){rr.videoConfirmed={};rr.seenScreencasts=[];rr.contentQuizzes=rr.contentQuizzes||{};rr.contentQuizzes.screencasts={};}else if(scope==='popoutquizzes'){rr.contentQuizzes={reading:{},screencasts:{}};}else if(scope==='assessments'){rr.weekQuizzes={};rr.phaseAssessments={};}else if(scope==='projects'){rr.assignmentStatus={};}await saveST();fill()}catch(e){msg('Reset failed: '+e.message);btn.disabled=false;btn.textContent='Reset'}});
 };
 $('#rsearch').oninput=fill;$('#rstudent').onchange=show;$('#rrefresh').onclick=fill;
 $('#rpull').onclick=async()=>{if(!TK)return msg('Connect to the backend first.');try{let off=0,n=0;for(;;){const j=await bk('adminExportAll',{offset:off,limit:10});if(!j.ok)throw new Error(j.message||j.error||'Could not load students');(j.students||[]).forEach(x=>addSt(x.email,x));n+=(j.students||[]).length;if(j.done)break;off+=10}await saveST();fill();msg('Loaded '+n+' student records from the backend.')}catch(e){msg('Could not load students: '+e.message)}};
 fill();
}

/* ===== preview ===== */
let pvOn=false;function preview(){if(!src)return;const v=$('#view');let f=$('#pv');if(!f){f=E('iframe',{id:'pv'});f.sandbox='allow-scripts allow-popups';v.prepend(f)}
 const guard='<script>(function(){var f=window.fetch;window.fetch=function(u){if(/script\\.google|googleusercontent|index\\.html|\\?_hm/.test(String(u)))return Promise.reject(0);return f.apply(this,arguments)}})()<\/script>';
 f.srcdoc=bake().replace(/<head>/,'<head>'+guard)}
$('#bpv').onclick=()=>{if(!src)return;pvOn=!pvOn;if(pvOn)preview();else $('#pv')?.remove();$('#bpv').textContent=pvOn?'Close preview':'Preview'};
$('#bpub').onclick=()=>go('publish');
/* ===== boot ===== */
const nav=$('#nav');nav.append(E('h1',{},'Course Studio'));
Object.keys(SECT).forEach(k=>{if(k=='progressReset'||k=='source')nav.append(E('hr'));const b=E('button',{textContent:SECT[k].t});b.dataset.k=k;b.onclick=()=>{pvOn=false;$('#bpv').textContent='Preview';go(k)};nav.append(b)});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
go('publish');if(LS.o&&LS.r&&LS.t)pull().then(()=>go('site'));

 @media(max-width:800px){#app{grid-template-columns:1fr}nav{position:sticky;top:0;z-index:20;height:auto;max-height:42vh;overflow:auto}nav button{width:auto;display:inline-flex;white-space:nowrap}main{padding:0 14px 40px}header{flex-wrap:wrap}header h2{min-width:100%}}
 `;
 const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
})();
